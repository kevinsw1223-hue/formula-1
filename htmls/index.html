<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Strikers - Arcade Football</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* 스크롤바 완전 제거 */
    }
    #wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 10; /* 반응형 비율 유지 */
      max-height: 95vh;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border-radius: 8px;
      overflow: hidden;
      background-color: #388e3c;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 20px;
    }
    .scoreboard {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 20px;
      border-radius: 25px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      align-self: center;
      backdrop-filter: blur(4px);
    }
    .team-score {
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .blue-team { color: #2196f3; }
    .red-team { color: #f44336; }
    .timer {
      font-size: 16px;
      color: #ffd54f;
      font-weight: bold;
      min-width: 50px;
      text-align: center;
    }
    .controls-hint {
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 11px;
      color: #ddd;
      align-self: center;
      margin-bottom: 2px;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    #overlay h1 {
      font-size: 32px;
      color: #4caf50;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
    }
    #overlay p {
      font-size: 14px;
      color: #ddd;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn {
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
    }
    .btn:hover {
      background: #45a049;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div id="wrapper">
    <div id="game-container">
      <canvas id="gameCanvas" width="800" height="500"></canvas>
      
      <div class="ui-layer">
        <div class="scoreboard">
          <div class="team-score blue-team">USER <span id="score-home">0</span></div>
          <div class="timer" id="timer-text">01:30</div>
          <div class="team-score red-team"><span id="score-away">0</span> AI</div>
        </div>
        <div class="controls-hint">
          [W,A,S,D] 이동 | [Space] 슛 | [K] 패스 | [Shift] 대시
        </div>
      </div>

      <div id="overlay">
        <h1 id="overlay-title">PIXEL STRIKERS</h1>
        <p id="overlay-desc">W, A, S, D로 이동하고, Space 키로 강력한 슛을 날리세요!<br>AI 팀을 상대로 최고의 명경기를 펼쳐보세요.</p>
        <button class="btn" id="start-btn" onclick="startGame()">게임 시작</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const PITCH = {
      x: 35,
      y: 35,
      width: canvas.width - 70,
      height: canvas.height - 70,
      goalHeight: 120
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    class Ball {
      constructor() {
        this.reset();
        this.radius = 7;
        this.friction = 0.985;
      }

      reset() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.vx = 0;
        this.vy = 0;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        this.vx *= this.friction;
        this.vy *= this.friction;

        const goalTop = (canvas.height - PITCH.goalHeight) / 2;
        const goalBottom = goalTop + PITCH.goalHeight;

        if (this.y < goalTop || this.y > goalBottom) {
          if (this.x - this.radius < PITCH.x) {
            this.x = PITCH.x + this.radius;
            this.vx *= -0.7;
          }
          if (this.x + this.radius > PITCH.x + PITCH.width) {
            this.x = PITCH.x + PITCH.width - this.radius;
            this.vx *= -0.7;
          }
        }

        if (this.y - this.radius < PITCH.y) {
          this.y = PITCH.y + this.radius;
          this.vy *= -0.7;
        }
        if (this.y + this.radius > PITCH.y + PITCH.height) {
          this.y = PITCH.y + PITCH.height - this.radius;
          this.vy *= -0.7;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x + 2, this.y + 3, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    class Player {
      constructor(x, y, team, isUser = false) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.radius = 13;
        this.team = team;
        this.isUser = isUser;
        this.speed = isUser ? 3.6 : 3.0;
        this.color = team === 'home' ? '#2196f3' : '#f44336';
        this.dashCooldown = 0;
      }

      reset() {
        this.x = this.startX;
        this.y = this.startY;
      }

      update(ball) {
        if (this.dashCooldown > 0) this.dashCooldown--;

        if (this.isUser) {
          this.handleUserInput(ball);
        } else {
          this.handleAI(ball);
        }

        this.x = Math.max(PITCH.x + this.radius, Math.min(PITCH.x + PITCH.width - this.radius, this.x));
        this.y = Math.max(PITCH.y + this.radius, Math.min(PITCH.y + PITCH.height - this.radius, this.y));

        this.handleBallCollision(ball);
      }

      handleUserInput(ball) {
        let dx = 0;
        let dy = 0;

        if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

        if (dx !== 0 && dy !== 0) {
          dx *= 0.7071;
          dy *= 0.7071;
        }

        let currentSpeed = this.speed;

        if ((keys['ShiftLeft'] || keys['KeyL']) && this.dashCooldown === 0) {
          currentSpeed *= 1.8;
          this.dashCooldown = 60;
        }

        this.x += dx * currentSpeed;
        this.y += dy * currentSpeed;

        if (keys['Space'] || keys['KeyJ']) {
          const dist = Math.hypot(ball.x - this.x, ball.y - this.y);
          if (dist < this.radius + ball.radius + 8) {
            const targetX = PITCH.x + PITCH.width;
            const targetY = canvas.height / 2;
            const angle = Math.atan2(targetY - ball.y, targetX - ball.x);
            const power = 10.5;
            ball.vx = Math.cos(angle) * power;
            ball.vy = Math.sin(angle) * power;
          }
        }

        if (keys['KeyK']) {
          const dist = Math.hypot(ball.x - this.x, ball.y - this.y);
          if (dist < this.radius + ball.radius + 8) {
            const angle = Math.atan2(dy, dx);
            const power = 7.5;
            ball.vx = (dx !== 0 || dy !== 0) ? Math.cos(angle) * power : 6.5;
            ball.vy = (dx !== 0 || dy !== 0) ? Math.sin(angle) * power : 0;
          }
        }
      }

      handleAI(ball) {
        const distToBall = Math.hypot(ball.x - this.x, ball.y - this.y);

        if (distToBall < 230) {
          const angle = Math.atan2(ball.y - this.y, ball.x - this.x);
          this.x += Math.cos(angle) * this.speed;
          this.y += Math.sin(angle) * this.speed;

          if (distToBall < this.radius + ball.radius + 5) {
            const targetX = PITCH.x;
            const targetY = canvas.height / 2 + (Math.random() * 30 - 15);
            const shootAngle = Math.atan2(targetY - ball.y, targetX - ball.x);
            const power = 9.0;
            ball.vx = Math.cos(shootAngle) * power;
            ball.vy = Math.sin(shootAngle) * power;
          }
        } else {
          const angle = Math.atan2(this.startY - this.y, this.startX - this.x);
          this.x += Math.cos(angle) * (this.speed * 0.5);
          this.y += Math.sin(angle) * (this.speed * 0.5);
        }
      }

      handleBallCollision(ball) {
        const dist = Math.hypot(ball.x - this.x, ball.y - this.y);
        if (dist < this.radius + ball.radius) {
          const angle = Math.atan2(ball.y - this.y, ball.x - this.x);
          const pushForce = 1.2;
          ball.vx += Math.cos(angle) * pushForce;
          ball.vy += Math.sin(angle) * pushForce;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x + 2, this.y + 3, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        if (this.isUser) {
          ctx.beginPath();
          ctx.moveTo(this.x, this.y - this.radius - 10);
          ctx.lineTo(this.x - 5, this.y - this.radius - 17);
          ctx.lineTo(this.x + 5, this.y - this.radius - 17);
          ctx.closePath();
          ctx.fillStyle = '#ffd54f';
          ctx.fill();
        }
      }
    }

    let ball;
    let players = [];
    let scoreHome = 0;
    let scoreAway = 0;
    let gameTime = 90;
    let timerInterval = null;
    let isGameRunning = false;

    function initGame() {
      ball = new Ball();
      players = [
        new Player(canvas.width * 0.3, canvas.height / 2, 'home', true),
        new Player(canvas.width * 0.2, canvas.height * 0.3, 'home', false),
        new Player(canvas.width * 0.2, canvas.height * 0.7, 'home', false),
        new Player(canvas.width * 0.7, canvas.height / 2, 'away', false),
        new Player(canvas.width * 0.8, canvas.height * 0.3, 'away', false),
        new Player(canvas.width * 0.8, canvas.height * 0.7, 'away', false)
      ];
    }

    function checkGoals() {
      const goalTop = (canvas.height - PITCH.goalHeight) / 2;
      const goalBottom = goalTop + PITCH.goalHeight;

      if (ball.x > PITCH.x + PITCH.width && ball.y > goalTop && ball.y < goalBottom) {
        scoreHome++;
        document.getElementById('score-home').innerText = scoreHome;
        resetPositions();
      }

      if (ball.x < PITCH.x && ball.y > goalTop && ball.y < goalBottom) {
        scoreAway++;
        document.getElementById('score-away').innerText = scoreAway;
        resetPositions();
      }
    }

    function resetPositions() {
      ball.reset();
      players.forEach(p => p.reset());
    }

    function drawPitch() {
      ctx.fillStyle = '#43a047';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#388e3c';
      const stripeWidth = PITCH.width / 10;
      for (let i = 0; i < 10; i += 2) {
        ctx.fillRect(PITCH.x + i * stripeWidth, PITCH.y, stripeWidth, PITCH.height);
      }

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(PITCH.x, PITCH.y, PITCH.width, PITCH.height);

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, PITCH.y);
      ctx.lineTo(canvas.width / 2, PITCH.y + PITCH.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
      ctx.stroke();

      const goalTop = (canvas.height - PITCH.goalHeight) / 2;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.fillRect(PITCH.x - 20, goalTop, 20, PITCH.goalHeight);
      ctx.strokeRect(PITCH.x - 20, goalTop, 20, PITCH.goalHeight);

      ctx.fillRect(PITCH.x + PITCH.width, goalTop, 20, PITCH.goalHeight);
      ctx.strokeRect(PITCH.x + PITCH.width, goalTop, 20, PITCH.goalHeight);
    }

    function updateTimer() {
      if (gameTime > 0) {
        gameTime--;
        const mins = String(Math.floor(gameTime / 60)).padStart(2, '0');
        const secs = String(gameTime % 60).padStart(2, '0');
        document.getElementById('timer-text').innerText = `${mins}:${secs}`;
      } else {
        endGame();
      }
    }

    function startGame() {
      document.getElementById('overlay').style.display = 'none';
      scoreHome = 0;
      scoreAway = 0;
      gameTime = 90;
      document.getElementById('score-home').innerText = '0';
      document.getElementById('score-away').innerText = '0';
      
      initGame();
      isGameRunning = true;

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);

      requestAnimationFrame(gameLoop);
    }

    function endGame() {
      isGameRunning = false;
      clearInterval(timerInterval);
      
      const overlay = document.getElementById('overlay');
      const title = document.getElementById('overlay-title');
      const desc = document.getElementById('overlay-desc');
      const btn = document.getElementById('start-btn');

      overlay.style.display = 'flex';
      btn.innerText = '다시 플레이';

      if (scoreHome > scoreAway) {
        title.innerText = 'VICTORY!';
        title.style.color = '#4caf50';
        desc.innerText = `축하합니다! ${scoreHome} : ${scoreAway} 로 승리했습니다!`;
      } else if (scoreHome < scoreAway) {
        title.innerText = 'DEFEAT...';
        title.style.color = '#f44336';
        desc.innerText = `아쉽습니다. ${scoreHome} : ${scoreAway} 로 패배했습니다.`;
      } else {
        title.innerText = 'DRAW';
        title.style.color = '#ffd54f';
        desc.innerText = `${scoreHome} : ${scoreAway} 무승부로 종료되었습니다.`;
      }
    }

    function gameLoop() {
      if (!isGameRunning) return;

      ball.update();
      players.forEach(player => player.update(ball));
      checkGoals();

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPitch();
      ball.draw();
      players.forEach(player => player.draw());

      requestAnimationFrame(gameLoop);
    }

    initGame();
    drawPitch();
    ball.draw();
    players.forEach(p => p.draw());
  </script>
</body>
</html>
